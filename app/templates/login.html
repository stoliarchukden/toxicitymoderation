{% extends "base.html" %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-5">

        <div class="card shadow-sm mt-5">

            <div class="card-body p-4">

                <h2 class="mb-4 text-center">
                    Вхід модератора
                </h2>

                {% if error %}
                <div class="alert alert-danger">
                    {{ error }}
                </div>
                {% endif %}

                <form method="post">

                    <div class="mb-3">
                        <label class="form-label">
                            Логін
                        </label>

                        <input
                            type="text"
                            name="username"
                            class="form-control"
                            required
                        >
                    </div>

                    <div class="mb-4">
                        <label class="form-label">
                            Пароль
                        </label>

                        <input
                            type="password"
                            name="password"
                            class="form-control"
                            required
                        >
                    </div>

                    <button class="btn btn-dark w-100">
                        Увійти
                    </button>

                </form>

                <div class="text-muted small mt-3">
                    Демонстраційний доступ: moderator / 1111
                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
